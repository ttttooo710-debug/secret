<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тебе эмоция</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: radial-gradient(circle at center, #5c2538 0%, #240d15 100%);
    color: #fff;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
  }
  .screen { display: none; flex-direction: column; align-items: center; width: 90%; max-width: 360px; animation: fadeIn 0.6s ease; }
  .screen.active { display: flex; }
  
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 10px; text-shadow: 0 0 15px rgba(255,180,200,0.5); }
  p.hint { font-style: italic; font-size: 15px; color: #f3c6d3; margin-bottom: 24px; }
  
  input {
    width: 100%; padding: 14px; border-radius: 25px; border: none;
    background: rgba(255, 255, 255, 0.15); color: #fff; font-size: 16px;
    text-align: center; outline: none; margin-bottom: 14px;
    backdrop-filter: blur(5px);
  }
  input::placeholder { color: rgba(255,255,255,0.5); }
  
  button {
    width: 100%; padding: 14px; border-radius: 25px; border: none;
    background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 100%);
    color: #4a1525; font-size: 16px; font-weight: 600; cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 154, 158, 0.4);
    transition: transform 0.2s;
  }
  button:active { transform: scale(0.96); }
  .error { color: #ff8080; font-size: 13px; margin-top: 10px; height: 18px; }

  .envelope-box { cursor: pointer; margin-top: 20px; }
  .envelope {
    width: 240px; height: 150px; background: #fdf0d5; border-radius: 8px;
    position: relative; display: flex; justify-content: center; align-items: center;
    box-shadow: 0 0 35px rgba(255, 220, 180, 0.6);
    transition: transform 0.3s;
  }
  .envelope:hover { transform: scale(1.03); }
  .seal {
    width: 36px; height: 36px; background: #d62828; border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .tap-text { margin-top: 18px; font-style: italic; font-size: 14px; color: #f3c6d3; }

  #video-screen {
    position: fixed; inset: 0; width: 100vw; height: 100dvh; max-width: none;
    background: #000; z-index: 999;
  }
  video { width: 100%; height: 100%; object-fit: cover; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

  <div id="lock-screen" class="screen active">
    <h1>Эта эмоция закрыта словом</h1>
    <p class="hint" id="hint-text">где мы познакомились?</p>
    <input type="text" id="secret-input" placeholder="слово" autocomplete="off">
    <button id="unlock-btn" onclick="checkPassword()">Открыть</button>
    <div class="error" id="error-msg"></div>
  </div>

  <div id="envelope-screen" class="screen">
    <h1 id="title-text" style="margin-bottom: 20px; font-style: italic;">Доминика, тебе письмо</h1>
    <div class="envelope-box" onclick="openVideo()">
      <div class="envelope">
        <div class="seal"></div>
      </div>
      <p class="tap-text" id="env-status">открой, это тебе</p>
    </div>
  </div>

  <div id="video-screen" class="screen">
    <video id="prank-video" src="video.mp4" playsinline loop></video>
  </div>

<script>
  const QUESTION = "где мы познакомились?";
  const SECRET_WORD = "тг";
  const GREETING = "Доминика, тебе письмо";

  document.getElementById('hint-text').innerText = QUESTION;
  document.getElementById('title-text').innerText = GREETING;

  const video = document.getElementById('prank-video');

  function checkPassword() {
    const val = document.getElementById('secret-input').value.trim().toLowerCase();
    const btn = document.getElementById('unlock-btn');
    const err = document.getElementById('error-msg');

    if (val === SECRET_WORD.toLowerCase()) {
      btn.innerText = "проверяю...";
      err.innerText = "";
      video.load();
      setTimeout(() => {
        document.getElementById('lock-screen').classList.remove('active');
        document.getElementById('envelope-screen').classList.add('active');
      }, 900);
    } else {
      err.innerText = "Неверное слово, попробуй ещё раз";
    }
  }

  function openVideo() {
    document.getElementById('env-status').innerText = "открываю...";
    setTimeout(() => {
      document.getElementById('envelope-screen').classList.remove('active');
      document.getElementById('video-screen').classList.add('active');
      video.muted = false;
      video.play();
    }, 600);
  }
</script>
</body>
</html>
